[package]
name = "livre-app"
description = "MatLivre live script editor (ModernWinForms look)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "matlivre"
path = "src/main.rs"

# Read by Release Manager: the name the installed program and its GitHub releases go by.
[package.metadata.release-manager]
title = "MatLivre"

[dependencies]
livre-lang = { path = "../livre-lang" }
livre-doc = { path = "../livre-doc" }
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"
raw-window-handle = "0.6"
resvg = "0.49"
arboard = "3.7"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }
