[package]
name = "livre-app"
description = "matlivre live script editor (ModernWinForms look)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "matlivre"
path = "src/main.rs"

[dependencies]
livre-lang = { path = "../livre-lang" }
livre-doc = { path = "../livre-doc" }
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"
