[package]
name = "livre-lang"
description = "Lexer, parser and interpreter for the matlivre MATLAB-compatible language"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rayon = "1.12"
rustfft = "6"
faer = "0.24"
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
libm = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint", "std"] }
num-traits = "0.2"
complex-bessel = "0.3"
num-complex = "0.4"
