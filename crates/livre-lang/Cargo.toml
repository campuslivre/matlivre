[package]
name = "livre-lang"
description = "Lexer, parser and interpreter for the matlivre MATLAB-compatible language"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rayon = "1.12"
rustfft = "6"
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpu-time = "1"
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
hound = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
faer = "0.24"
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
libm = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint", "std"] }
num-traits = "0.2"
complex-bessel = "0.3"
num-complex = "0.4"
