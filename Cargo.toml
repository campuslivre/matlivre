[workspace]
resolver = "2"
members = ["crates/livre-lang", "crates/livre-doc", "crates/livre-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# For trying changes at close to release speed: optimised, but without the whole-program
# link-time optimisation and single codegen unit that make release builds slow to redo.
# cargo build --profile fast -p livre-app  ->  target\fast\matlivre.exe
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
