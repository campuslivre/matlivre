name: Arch Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archlinux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Install Arch toolchain and test dependencies
        run: pacman -Syu --needed --noconfirm rust git python ttf-dejavu

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: archlinux

      - name: Test workspace
        run: cargo test --locked --workspace -- --test-threads=2

      - name: Build GUI and CLI binaries
        run: cargo build --locked --workspace --bins

      - name: Exercise CLI and headless MCP exports
        run: python tools/linux/smoke.py
